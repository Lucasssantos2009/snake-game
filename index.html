<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Snake</title>
<style>
body{margin:0;background:#111;color:white;text-align:center;font-family:Arial}
h1{color:#7cff4f}
canvas{background:#222;border:3px solid #7cff4f;margin-top:10px}
button{padding:10px 20px;margin:10px;font-size:16px}
</style>
</head>
<body>

<h1>🐍 Snake</h1>
<div>Pontos: <span id="score">0</span></div>
<canvas id="game" width="400" height="400"></canvas><br>
<button onclick="restart()">Reiniciar</button>

<script>
const c=document.getElementById("game");
const ctx=c.getContext("2d");
const size=20;

let snake,food,dir,score,game;

function start(){
 snake=[{x:200,y:200}];
 food=randomFood();
 dir={x:size,y:0};
 score=0;
 document.getElementById("score").innerHTML=score;
 clearInterval(game);
 game=setInterval(loop,100);
}

function randomFood(){
 return {
  x:Math.floor(Math.random()*20)*size,
  y:Math.floor(Math.random()*20)*size
 };
}

function loop(){
 let head={
  x:snake[0].x+dir.x,
  y:snake[0].y+dir.y
 };

 if(head.x<0||head.y<0||head.x>=400||head.y>=400||
 snake.some(p=>p.x==head.x&&p.y==head.y)){
  clearInterval(game);
  alert("Game Over! Pontos: "+score);
  return;
 }

 snake.unshift(head);

 if(head.x==food.x&&head.y==food.y){
  score++;
  document.getElementById("score").innerHTML=score;
  food=randomFood();
 }else{
  snake.pop();
 }

 draw();
}

function draw(){
 ctx.fillStyle="#222";
 ctx.fillRect(0,0,400,400);

 ctx.fillStyle="red";
 ctx.font="20px Arial";
 ctx.fillText("🍎",food.x,food.y+18);

 ctx.fillStyle="#7cff4f";
 snake.forEach(p=>{
  ctx.fillRect(p.x,p.y,size,size);
 });
}

document.addEventListener("keydown",e=>{
 if(e.key=="ArrowUp"&&dir.y==0)dir={x:0,y:-size};
 if(e.key=="ArrowDown"&&dir.y==0)dir={x:0,y:size};
 if(e.key=="ArrowLeft"&&dir.x==0)dir={x:-size,y:0};
 if(e.key=="ArrowRight"&&dir.x==0)dir={x:size,y:0};
});

function restart(){
 start();
}

start();
</script>

</body>
</html>
